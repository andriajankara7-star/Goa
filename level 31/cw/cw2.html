<h1>Employee Details</h1>
<!-- Creating Input texts -->
<form>
<label for="fn">First name:</label>
<input type="text" id="fn" name="First name"><br><br>
<label for="ln">Last name:</label>
<input type="text" id="ln" name="Last name"><br><br>
<!-- Creating Input radios-->
<p>Enter your gender</p>
<label for="ma">Male</label>
<input type="radio" id="ma" name="gender" value="Male"><br>
<label for="fe">Female</label>
<input type="radio" id="fe" name="gender" value="Female"><br><br>
<!-- Creating more input texts -->
<label for="id">Employee id:</label>
<input type="text" name="Employee id" id="id"><br><br>
<label for="des">Designation:</label>
<input type="text" name="Designation" id="des"><br><br>
<label for="num">Phone number:</label>
<input type="text" name="Phone number" id="num"><br><br>
<input type="submit">
</form>
