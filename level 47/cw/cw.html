<!-- color  ცვლის ტექსტის ფერს font-size ცვლის რამხელაა ტექსტი  text-align ცვლის ტექსტი სად იწერება მაგ მარჯვნივ მარცხნივ და შუაში background-color ცვლის უკანა ფერს მაგ: -->
<body style="background-color:white;">
<p style="color: aqua;">hello</p>
<p style="font-size: 30px;">hello </p>
<p style="text-align: center;">hello </p>
</body>
<!-- inline ელემენტი შენ ბევრი რომ დაწერო ერთიდაიგივე ხაზსე გამოვა თუ ბრ-ს არ დაწერ და ბორდერს თუ გამოიყენებ რამდენიც წერია იქამდე გააკეთებს ბორდერს
block ელემენტი ბევრი რომ დაწერო და გინდა შემდეგ ხაზზე გადავიდევს ბრ თეგი არ სჭირდება იმიტომ რომ თვითონ გადადის და ბორდერს რომ შეუქმნი ის ბორდერს გააკეთებს მთლიან ხაზზე მაგ: -->
<b style="border: 2px solid blue;">hello</b>
<p style="border: 2px solid lime;">hello</p>
<p>hello</p>
<p>hello</p>
<p>hello</p>
<p>hello</p>
<p>hello</p>
<b>hello</b>
<b>hello</b>
<b>hello</b>
<b>hello</b>
<b>hello</b>

<!-- რის HTML-ის ბლოკური კონტეინერი  რომელიც გამოიყენება ელემენტების დაჯგუფებისა და სტრუქტურირებისთვის თავისთავად მას არ აქვს ვიზუალური ეფექტი  მისი მთავარი დანიშნულებაა რომ ელემენტები ერთ ჯგუფად გააერთიანოს -->
<div style="color: blue;">
<h1>div</h1>
<h2>is</h2>
<h3>good</h3>
<h4>this is h4</h4>
<h5>h5</h5>
<h6>h6</h6>
</div>
