<h1>Sign up</h1>
<form>
<label for="name"> full name:</label>
<input type="text" id="name"><br><br>
<label for="email">Email or phone number:</label>
<input type="text" id="email"><br><br>
<label for="password">Password:</label>
<input type="password" id="password"><br><br>
<label for="confirm password">Confirm your password:</label>
<input type="password" id="confirm password"><br><br>
<label for="r1">male</label>
<input type="radio" name="gender" id="r1" value="male">
<label for="r2">female</label>
<input type="radio" name="gender" id="r2" value="female"><br><br>
<input type="submit">
</form>
<!--name value ატრიბუტი გამოიყენება ფორმზე სახელის შესანახად -->
<!--checkbox და radio არის ორივე შემოსახაზი მაგრამ რადიოთი მარტო 1 შეგიძლია შემოხაზო და ჩეკბოქსით რამდენიც გინდა-->
<!-- ლაბელი ინფუთს იმიტომ უნდა დავაკავშიროტ რომ ლაბელს რომ დავაწვებით ეგრევე დაიწყებს წერას ინფუთში და ეს ჩვენ შეგვიძლია გავომიყენოთ for=""-ით და id=""-ით -->
